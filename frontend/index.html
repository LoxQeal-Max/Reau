<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reau - Android 自动化测试工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .tab-active { border-bottom: 3px solid #667eea; color: #667eea; }
        .log-line { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
        .log-info { color: #64748b; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-warning { color: #f59e0b; }
        .chat-bubble-user { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .chat-bubble-ai { background: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- 顶部导航 -->
<nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg gradient-bg flex items-center justify-center text-white font-bold">R</div>
            <h1 class="text-xl font-bold text-slate-800">Reau</h1>
            <span class="text-xs text-slate-400">Android 自动化测试工具</span>
        </div>
        <div class="flex items-center space-x-4">
            <div id="status-indicator" class="flex items-center space-x-2 text-sm">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span class="text-slate-500">未连接</span>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto p-4">

    <!-- 标签页 -->
    <div class="bg-white rounded-lg shadow-sm mb-4">
        <div class="flex border-b border-slate-200">
            <button onclick="switchTab('device')" id="tab-device" class="px-6 py-3 text-sm font-medium text-slate-600 hover:text-slate-900 tab-active">
                📱 设备管理
            </button>
            <button onclick="switchTab('record')" id="tab-record" class="px-6 py-3 text-sm font-medium text-slate-600 hover:text-slate-900">
                ⏺️ 录制回放
            </button>
            <button onclick="switchTab('ai')" id="tab-ai" class="px-6 py-3 text-sm font-medium text-slate-600 hover:text-slate-900">
                🤖 AI Agent
            </button>
            <button onclick="switchTab('logs')" id="tab-logs" class="px-6 py-3 text-sm font-medium text-slate-600 hover:text-slate-900">
                📋 日志
            </button>
        </div>
    </div>

    <!-- 设备管理 -->
    <div id="panel-device" class="panel">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- 设备状态 -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">设备连接</h2>
                <div id="device-info" class="text-center py-8">
                    <div class="w-20 h-20 mx-auto rounded-full bg-slate-200 flex items-center justify-center mb-4">
                        <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <p class="text-slate-500">暂无设备连接</p>
                    <div class="mt-4 space-y-2">
                        <input id="device-serial" type="text" placeholder="设备序列号（可选）" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <button onclick="connectDevice()" class="w-full py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                            🔌 连接设备
                        </button>
                    </div>
                </div>
                <div id="device-connected" class="hidden text-center">
                    <div class="w-20 h-20 mx-auto rounded-full bg-green-100 flex items-center justify-center mb-4">
                        <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <p id="device-serial-display" class="text-slate-800 font-mono"></p>
                    <p id="device-resolution" class="text-slate-500 text-sm mt-1"></p>
                    <button onclick="disconnectDevice()" class="mt-4 py-2 px-4 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition">
                        断开连接
                    </button>
                </div>
            </div>

            <!-- 屏幕预览 -->
            <div class="bg-white rounded-lg shadow-sm p-6 lg:col-span-2">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-800">屏幕预览</h2>
                    <button onclick="refreshScreenshot()" class="px-4 py-1.5 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition text-sm">
                        📸 刷新截图
                    </button>
                </div>
                <div id="screenshot-container" class="bg-slate-100 rounded-lg flex items-center justify-center" style="min-height: 400px;">
                    <p class="text-slate-400">请先连接设备</p>
                </div>
                <div id="ui-elements" class="mt-4 hidden">
                    <h3 class="text-sm font-medium text-slate-700 mb-2">UI 元素</h3>
                    <div id="elements-list" class="max-h-48 overflow-y-auto scrollbar-thin space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 录制回放 -->
    <div id="panel-record" class="panel hidden">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- 录制控制 -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">录制操作</h2>
                <div class="space-y-4">
                    <div class="flex space-x-2">
                        <button onclick="startRecording()" id="btn-record-start" class="flex-1 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-medium">
                            ⏺️ 开始录制
                        </button>
                        <button onclick="stopRecording()" id="btn-record-stop" class="flex-1 py-3 bg-slate-500 text-white rounded-lg hover:bg-slate-600 transition font-medium hidden" disabled>
                            ⏹️ 停止录制
                        </button>
                    </div>
                    <div id="recording-status" class="hidden text-center py-4">
                        <div class="inline-flex items-center space-x-2 text-red-500 pulse-dot">
                            <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                            <span>录制中...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 回放控制 -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">回放操作</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">选择录制脚本</label>
                        <select id="session-select" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="">-- 请选择 --</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">播放速度</label>
                            <select id="playback-speed" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                                <option value="0.5">0.5x 慢速</option>
                                <option value="1" selected>1.0x 正常</option>
                                <option value="2">2.0x 加速</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">循环次数</label>
                            <input id="playback-loop" type="number" value="1" min="1" max="100" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="startPlayback()" class="flex-1 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-medium">
                            ▶️ 开始回放
                        </button>
                        <button onclick="stopPlayback()" class="flex-1 py-3 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition font-medium">
                            ⏸️ 停止回放
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Agent -->
    <div id="panel-ai" class="panel hidden">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <!-- 任务输入 -->
            <div class="lg:col-span-1 bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">AI 任务</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">任务描述</label>
                        <textarea id="ai-task" rows="4" placeholder="例如：完成每日签到、领取奖励..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">最大步骤数</label>
                        <input id="ai-max-steps" type="number" value="20" min="1" max="100" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    </div>
                    <button onclick="executeAiTask()" class="w-full py-3 gradient-bg text-white rounded-lg hover:opacity-90 transition font-medium">
                        🚀 AI 执行任务
                    </button>
                    <div class="pt-4 border-t border-slate-200">
                        <h3 class="text-sm font-medium text-slate-700 mb-2">快速任务</h3>
                        <div class="space-y-2">
                            <button onclick="setTask('点击屏幕上的确定按钮')" class="w-full text-left px-3 py-2 bg-slate-50 rounded-lg hover:bg-slate-100 transition text-sm">
                                ✅ 点击确定按钮
                            </button>
                            <button onclick="setTask('关闭所有弹窗')" class="w-full text-left px-3 py-2 bg-slate-50 rounded-lg hover:bg-slate-100 transition text-sm">
                                ❌ 关闭弹窗
                            </button>
                            <button onclick="setTask('进入游戏主页')" class="w-full text-left px-3 py-2 bg-slate-50 rounded-lg hover:bg-slate-100 transition text-sm">
                                🏠 进入主页
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI 对话区 -->
            <div class="lg:col-span-3 bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">执行过程</h2>
                <div id="ai-chat" class="h-[600px] overflow-y-auto scrollbar-thin space-y-4 p-4 bg-slate-50 rounded-lg">
                    <div class="text-center text-slate-400 py-20">
                        <div class="w-16 h-16 mx-auto rounded-full bg-indigo-100 flex items-center justify-center mb-4">
                            <span class="text-2xl">🤖</span>
                        </div>
                        <p>AI Agent 已就绪</p>
                        <p class="text-sm mt-2">输入任务描述，AI 将自动执行</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 日志 -->
    <div id="panel-logs" class="panel hidden">
        <div class="bg-white rounded-lg shadow-sm">
            <div class="flex items-center justify-between p-4 border-b border-slate-200">
                <h2 class="text-lg font-semibold text-slate-800">实时日志</h2>
                <button onclick="clearLogs()" class="px-4 py-1.5 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition text-sm">
                    🗑️ 清空日志
                </button>
            </div>
            <div id="log-container" class="h-[500px] overflow-y-auto scrollbar-thin p-4 bg-slate-900">
                <!-- 日志动态添加 -->
            </div>
        </div>
    </div>

</div>

<script>
let ws = null;
let deviceConnected = false;

// ============ 初始化 ============
function init() {
    connectWebSocket();
    checkDeviceStatus();
    loadSessions();
}

function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
    
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'log') {
            addLog(data.message, data.level);
        }
    };
    
    ws.onclose = () => {
        setTimeout(connectWebSocket, 3000);
    };
}

// ============ 标签页切换 ============
function switchTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.remove('tab-active'));
    
    document.getElementById(`panel-${tab}`).classList.remove('hidden');
    document.getElementById(`tab-${tab}`).classList.add('tab-active');
    
    if (tab === 'device' && deviceConnected) {
        refreshScreenshot();
    }
    if (tab === 'record') {
        loadSessions();
    }
}

// ============ 设备管理 ============
async function checkDeviceStatus() {
    try {
        const res = await fetch('/api/device/status');
        const data = await res.json();
        if (data.connected) {
            showDeviceConnected(data);
        }
    } catch (e) {
        console.error(e);
    }
}

function showDeviceConnected(data) {
    deviceConnected = true;
    document.getElementById('device-info').classList.add('hidden');
    document.getElementById('device-connected').classList.remove('hidden');
    document.getElementById('device-serial-display').textContent = data.serial;
    document.getElementById('device-resolution').textContent = data.resolution;
    
    const indicator = document.getElementById('status-indicator');
    indicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 pulse-dot"></span><span class="text-green-600 font-medium">已连接</span>';
    
    refreshScreenshot();
}

async function connectDevice() {
    const serial = document.getElementById('device-serial').value;
    try {
        const res = await fetch('/api/device/connect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ serial })
        });
        const data = await res.json();
        if (data.success) {
            showDeviceConnected({ serial: data.serial });
            addLog(`设备连接成功: ${data.serial}`, 'success');
        } else {
            addLog(`连接失败: ${data.message}`, 'error');
        }
    } catch (e) {
        addLog(`连接请求失败: ${e.message}`, 'error');
    }
}

async function disconnectDevice() {
    try {
        await fetch('/api/device/disconnect', { method: 'POST' });
        deviceConnected = false;
        document.getElementById('device-info').classList.remove('hidden');
        document.getElementById('device-connected').classList.add('hidden');
        document.getElementById('status-indicator').innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-400"></span><span class="text-slate-500">未连接</span>';
        addLog('设备已断开', 'warning');
    } catch (e) {
        addLog(`断开失败: ${e.message}`, 'error');
    }
}

async function refreshScreenshot() {
    if (!deviceConnected) return;
    try {
        const res = await fetch('/api/device/screenshot');
        const data = await res.json();
        if (data.screenshot) {
            document.getElementById('screenshot-container').innerHTML = 
                `<img src="data:image/png;base64,${data.screenshot}" class="max-h-[450px] rounded-lg shadow">`;
        }
    } catch (e) {
        console.error(e);
    }
    
    // 获取 UI 元素
    try {
        const uiRes = await fetch('/api/device/ui-elements');
        const uiData = await uiRes.json();
        if (uiData.elements && uiData.elements.length > 0) {
            document.getElementById('ui-elements').classList.remove('hidden');
            document.getElementById('elements-list').innerHTML = uiData.elements
                .slice(0, 50)
                .map(el => `<div class="px-2 py-1 bg-slate-50 rounded text-xs"><span class="text-indigo-600">${el.text || el.resource_id}</span> <span class="text-slate-400">${JSON.stringify(el.bounds)}</span></div>`)
                .join('');
        }
    } catch (e) {
        console.error(e);
    }
}

// ============ 录制 ============
async function startRecording() {
    if (!deviceConnected) {
        addLog('请先连接设备', 'error');
        return;
    }
    try {
        const res = await fetch('/api/recording/start', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            document.getElementById('btn-record-start').classList.add('hidden');
            document.getElementById('btn-record-stop').classList.remove('hidden');
            document.getElementById('recording-status').classList.remove('hidden');
            addLog('开始录制...', 'success');
        }
    } catch (e) {
        addLog(`启动录制失败: ${e.message}`, 'error');
    }
}

async function stopRecording() {
    try {
        const res = await fetch('/api/recording/stop', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            document.getElementById('btn-record-start').classList.remove('hidden');
            document.getElementById('btn-record-stop').classList.add('hidden');
            document.getElementById('recording-status').classList.add('hidden');
            addLog(`录制完成，共 ${data.action_count} 个操作`, 'success');
            loadSessions();
        }
    } catch (e) {
        addLog(`停止录制失败: ${e.message}`, 'error');
    }
}

// ============ 回放 ============
async function loadSessions() {
    try {
        const res = await fetch('/api/playback/sessions');
        const data = await res.json();
        const select = document.getElementById('session-select');
        select.innerHTML = '<option value="">-- 请选择 --</option>';
        data.sessions.forEach(s => {
            const option = document.createElement('option');
            option.value = s.id;
            option.textContent = `${s.name} (${s.template_count} 模板)`;
            select.appendChild(option);
        });
    } catch (e) {
        console.error(e);
    }
}

async function startPlayback() {
    const sessionId = document.getElementById('session-select').value;
    if (!sessionId) {
        addLog('请选择要回放的脚本', 'error');
        return;
    }
    const speed = parseFloat(document.getElementById('playback-speed').value);
    const loopCount = parseInt(document.getElementById('playback-loop').value);
    
    try {
        const res = await fetch('/api/playback/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, speed, loop_count: loopCount })
        });
        const data = await res.json();
        if (data.success) {
            addLog('开始回放...', 'success');
        } else {
            addLog(data.error || '回放启动失败', 'error');
        }
    } catch (e) {
        addLog(`回放失败: ${e.message}`, 'error');
    }
}

async function stopPlayback() {
    try {
        await fetch('/api/playback/stop', { method: 'POST' });
        addLog('已发送停止指令', 'warning');
    } catch (e) {
        console.error(e);
    }
}

// ============ AI Agent ============
function setTask(task) {
    document.getElementById('ai-task').value = task;
}

async function executeAiTask() {
    const task = document.getElementById('ai-task').value;
    const maxSteps = parseInt(document.getElementById('ai-max-steps').value);
    
    if (!task) {
        addLog('请输入任务描述', 'error');
        return;
    }
    
    const chatDiv = document.getElementById('ai-chat');
    chatDiv.innerHTML = '';
    
    // 添加用户消息
    chatDiv.innerHTML += `
        <div class="flex justify-end">
            <div class="chat-bubble-user text-white px-4 py-2 rounded-2xl max-w-[80%]">
                <p>${task}</p>
            </div>
        </div>
    `;
    
    // 添加 AI 思考中消息
    const aiThinkingId = 'ai-thinking';
    chatDiv.innerHTML += `
        <div class="flex" id="${aiThinkingId}">
            <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-2 flex-shrink-0">🤖</div>
            <div class="chat-bubble-ai px-4 py-2 rounded-2xl">
                <span class="inline-flex items-center">
                    <span class="w-2 h-2 bg-slate-400 rounded-full mr-1 animate-bounce"></span>
                    <span class="w-2 h-2 bg-slate-400 rounded-full mr-1 animate-bounce" style="animation-delay: 0.1s"></span>
                    <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                </span>
            </div>
        </div>
    `;
    chatDiv.scrollTop = chatDiv.scrollHeight;
    
    try {
        const res = await fetch('/api/ai/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task, max_steps: maxSteps })
        });
        const data = await res.json();
        
        // 替换思考中消息
        document.getElementById(aiThinkingId).remove();
        
        if (data.success) {
            // 添加 AI 回复
            let resultHtml = `<div class="flex"><div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-2 flex-shrink-0">🤖</div><div class="chat-bubble-ai px-4 py-2 rounded-2xl max-w-[80%]">`;
            resultHtml += `<p class="font-medium mb-2">任务完成！共执行 ${data.steps} 步</p>`;
            resultHtml += `<div class="space-y-1">`;
            data.results.forEach((r, i) => {
                resultHtml += `<div class="text-sm flex items-center"><span class="mr-2">${r.success ? '✅' : '❌'}</span><span class="text-slate-600">步骤 ${r.step}: ${r.action}</span></div>`;
            });
            resultHtml += `</div></div></div>`;
            chatDiv.innerHTML += resultHtml;
        } else {
            chatDiv.innerHTML += `<div class="flex"><div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center mr-2 flex-shrink-0">❌</div><div class="bg-red-50 px-4 py-2 rounded-2xl text-red-600">${data.error}</div></div>`;
        }
        
        chatDiv.scrollTop = chatDiv.scrollHeight;
    } catch (e) {
        document.getElementById(aiThinkingId).remove();
        addLog(`AI 执行失败: ${e.message}`, 'error');
    }
}

// ============ 日志 ============
function addLog(message, level = 'info') {
    const container = document.getElementById('log-container');
    const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const levelClass = {
        'info': 'log-info',
        'success': 'log-success',
        'error': 'log-error',
        'warning': 'log-warning'
    }[level] || 'log-info';
    
    const line = document.createElement('div');
    line.className = `log-line ${levelClass} py-0.5`;
    line.textContent = `[${time}] ${message}`;
    container.appendChild(line);
    container.scrollTop = container.scrollHeight;
    
    // 同时更新 AI 对话的思考中消息
    const aiChat = document.getElementById('ai-chat');
    if (aiChat && !aiChat.classList.contains('hidden')) {
        const thinking = document.getElementById('ai-thinking');
        if (thinking) {
            thinking.querySelector('.chat-bubble-ai').innerHTML += `<div class="text-xs mt-1 text-slate-500">${message}</div>`;
        }
    }
}

function clearLogs() {
    document.getElementById('log-container').innerHTML = '';
}

// 启动
init();
</script>
